<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소음 지킴이 로봇 프로젝트 | 과학 3학년</title>
<style>
/* 토큰: 수업자료 스킬(lesson-html)의 과학 서식을 그대로 쓴다 */
:root{
  --subject:#047857; --ink:#16161A; --muted:#5E5E68; --line:#DCDCE3; --paper:#FFFFFF;
  --wash:color-mix(in srgb, var(--subject) 7%, white); --bg:#F4F5F7; --radius:12px;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:18px;line-height:1.6;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--subject)}
:focus-visible{outline:3px solid var(--subject);outline-offset:2px}
[hidden]{display:none !important}

/* 위쪽 상태 막대 */
.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:1rem;
  padding:.7rem 1.2rem;flex-wrap:wrap}
.logo{width:3rem;height:3rem;border-radius:12px;background:var(--subject);display:grid;place-items:center;font-weight:800;font-size:1.1rem;flex:none}
.bar h1{font-size:1.25rem;margin:0;line-height:1.3}
.bar .sub{font-size:.85rem;color:#C9C9D2}
.bar .grow{flex:1 1 auto}
.chips{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid #3A3A44;background:#24242B;color:#fff;border-radius:10px;padding:.42rem .8rem;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#8B8B97}
.chip.me{background:transparent;color:#FFD66B;border-color:#57575F;cursor:default}
.chip.live{cursor:default}
.chip.live::before{content:"";display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:#34D399;margin-right:.4rem}
.chip.go{background:var(--subject);border-color:var(--subject)}
.chip.danger{background:#3B1515;border-color:#7F1D1D;color:#FECACA}

/* 본문 배치 */
.wrap{display:grid;grid-template-columns:20rem 1fr;gap:1.2rem;padding:1.2rem;max-width:90rem;margin:0 auto}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:1.2rem}
.side h2{font-size:1.1rem;margin:0 0 .8rem}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem}
.flow button{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:.7rem .9rem;cursor:pointer}
.flow button:hover{border-color:var(--subject)}
.flow .t{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.flow b{display:block;font-size:1rem;margin-top:.15rem}
.flow .now{background:var(--subject);border-color:var(--subject);color:#fff}
.flow .now .t{color:#D1FAE5}
.flow .tag{background:#fff;color:var(--subject);border-radius:99px;padding:0 .5rem;font-size:.75rem;font-weight:700}
.flow .seen{outline:2px dashed var(--subject);outline-offset:2px}
.goalbox{border-left:5px solid var(--subject);background:var(--wash);padding:.8rem 1rem;border-radius:0 10px 10px 0;margin-top:1rem;font-size:.92rem}
.goalbox h3{margin:0 0 .3rem;font-size:.9rem;color:var(--subject)}
.goalbox ul{margin:0;padding-left:1.1rem}

.tabs{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.tab{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:.45rem .9rem;cursor:pointer;font-size:.9rem}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs .grow{flex:1}
.stephead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.pill{display:inline-block;background:var(--wash);color:var(--subject);font-weight:700;border-radius:99px;padding:.15rem .8rem;font-size:.85rem}
.timer{border:1.5px solid var(--subject);color:var(--subject);background:var(--paper);border-radius:99px;padding:.1rem .7rem;font-weight:700;cursor:pointer}
.timer[data-running]{background:var(--subject);color:#fff}
.main h2{font-size:1.6rem;margin:.6rem 0 .8rem;letter-spacing:-.02em}
.say{color:var(--muted);border-left:2px solid var(--line);padding-left:.8rem;margin:.6rem 0}
.card{border:1.5px solid var(--line);border-radius:var(--radius);padding:1rem 1.2rem;margin:.8rem 0;background:var(--paper)}
.card h3{margin:0 0 .4rem;font-size:1.02rem}
.card ol,.card ul{margin:0;padding-left:1.3rem}.card li+li{margin-top:.2rem}
.card.warn{border-color:#B91C1C;border-width:2px}.card.warn h3{color:#B91C1C}.card.warn h3::before{content:"! ";font-weight:800}
.card.prep{background:var(--wash);border-style:dashed}
.check{list-style:none;padding:0;margin:.6rem 0}
.check li{padding-left:1.9rem;position:relative;margin:.35rem 0}
.check li::before{content:"";position:absolute;left:0;top:.28rem;width:1.05rem;height:1.05rem;border:1.5px solid var(--muted);border-radius:4px}
.answer{background:var(--wash);border-radius:10px;padding:.7rem .9rem;margin:.6rem 0;font-size:.95rem}
.answer::before{content:"교사용 답 ";font-weight:700;color:var(--subject)}
table{border-collapse:collapse;width:100%;margin:.6rem 0;font-size:.95rem}
th,td{border:1px solid var(--line);padding:.45rem .55rem;text-align:left;vertical-align:middle}
th{background:var(--wash)}

/* 문항 */
.q{border:1.5px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin:1rem 0;background:#FCFCFD}
.q .qt{font-weight:700;margin:0 0 .6rem}
.q .num{display:inline-grid;place-items:center;min-width:1.8rem;height:1.8rem;border-radius:50%;background:var(--subject);color:#fff;font-size:.9rem;margin-right:.45rem}
.field{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:.55rem .75rem;background:#fff;resize:vertical}
.field:focus{border-color:var(--subject)}
.field::placeholder{color:#9a9aa5}
td .field{padding:.4rem .5rem}
.qrow{display:flex;gap:.6rem;align-items:center;margin-top:.6rem;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:.55rem 1.1rem;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.sub{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn.green{background:var(--subject)}
.btn:disabled{opacity:.5;cursor:default}
.st{font-size:.85rem;color:var(--muted)}
.st.ok{color:var(--subject);font-weight:700}
.st.warn{color:#B45309;font-weight:700}
.answers{margin-top:.8rem;border-top:1px dashed var(--line);padding-top:.7rem}
.answers h4{margin:0 0 .4rem;font-size:.9rem;color:var(--muted)}
.ansgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.5rem}
.ans{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;font-size:.92rem}
.ans .who{font-size:.78rem;color:var(--subject);font-weight:700}
.ans pre{margin:.15rem 0 0;white-space:pre-wrap;font:inherit}
.switch{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;cursor:pointer}
.nav{display:flex;justify-content:space-between;gap:.6rem;margin-top:1.4rem}

/* 진행 현황 표 */
.roster td,.roster th{text-align:center;font-size:.85rem;padding:.35rem}
.roster td:first-child,.roster th:first-child{text-align:left}
.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:#C9C9D2;margin-right:.3rem}
.dot.on{background:#10B981}
.done{color:var(--subject);font-weight:800}

/* 입장 화면·모달 */
.gate{min-height:calc(100vh - 4.4rem);display:grid;place-items:center;padding:1.5rem}
.gate .panel{width:min(34rem,100%)}
.gate h2{margin:.2rem 0 1rem}
.gate label{display:block;font-weight:700;font-size:.9rem;margin:.8rem 0 .3rem}
.opts{display:flex;gap:.4rem;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:.45rem .85rem;cursor:pointer}
.opt.on{background:var(--subject);border-color:var(--subject);color:#fff}
.modal{position:fixed;inset:0;background:rgba(10,10,15,.55);display:grid;place-items:center;z-index:50;padding:1rem}
.modal .panel{width:min(30rem,100%);text-align:center}
.qrbox svg{width:min(18rem,70vw);height:auto}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:12px;z-index:60;font-size:.95rem}

@media(max-width:960px){.wrap{grid-template-columns:1fr}.bar h1{font-size:1.05rem}}
@media print{.bar,.side,.tabs,.nav,.qrow,.chip{display:none !important}.wrap{display:block;padding:0}.panel{border:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="logo">AI</div>
  <div><h1>소음 지킴이 로봇 프로젝트</h1><div class="sub" id="sub">3학년 과학 · 3. 소리의 성질 · 카미봇 파이 피지컬 AI</div></div>
  <div class="grow"></div>
  <div class="chips" id="chips" hidden>
    <span class="chip me" id="me"></span>
    <span class="chip live" id="live">접속 확인 중</span>
    <button class="chip go" id="btn-qr" type="button">QR 입장</button>
    <button class="chip" id="btn-save" type="button">결과저장</button>
    <button class="chip danger" id="btn-reset" type="button" hidden>초기화</button>
    <button class="chip" id="btn-exit" type="button">나가기</button>
  </div>
</header>

<!-- 입장 화면 -->
<section class="gate" id="gate">
  <div class="panel">
    <span class="pill">소음 지킴이 로봇 프로젝트</span>
    <h2>수업에 들어가기</h2>
    <label>몇 차시인가요?</label><div class="opts" id="opt-lesson"></div>
    <label>몇 반인가요?</label><div class="opts" id="opt-class"></div>
    <div id="student-fields">
      <label>몇 모둠인가요?</label><div class="opts" id="opt-group"></div>
      <label for="in-name">이름</label>
      <input class="field" id="in-name" maxlength="20" placeholder="이름을 써요" autocomplete="off">
    </div>
    <div id="teacher-fields" hidden>
      <label for="in-pin">교사 PIN</label>
      <input class="field" id="in-pin" type="password" maxlength="20" placeholder="Netlify에 정한 TEACHER_PIN" autocomplete="off">
    </div>
    <p class="st warn" id="gate-msg"></p>
    <div class="qrow">
      <button class="btn green" id="btn-enter" type="button">수업 입장하기 →</button>
      <button class="btn sub" id="btn-role" type="button">선생님으로 입장하기</button>
    </div>
  </div>
</section>

<!-- 수업 화면 -->
<div class="wrap" id="room" hidden>
  <aside class="panel side">
    <h2>오늘 수업 흐름</h2>
    <ul class="flow" id="flow"></ul>
    <div class="goalbox"><h3>이 시간에 할 일</h3><ul id="goals"></ul></div>
  </aside>
  <main class="panel main">
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="lesson" type="button">수업 화면</button>
      <button class="tab" data-tab="roster" type="button" id="tab-roster" hidden>진행 현황</button>
      <span class="grow"></span>
      <span class="st" id="sync"></span>
    </div>
    <div id="view-lesson"></div>
    <div id="view-roster" hidden></div>
  </main>
</div>

<div class="modal" id="qr-modal" hidden>
  <div class="panel">
    <h2>참여 QR코드</h2>
    <p class="st" id="qr-label"></p>
    <div class="qrbox" id="qr-box"></div>
    <p class="st" id="qr-url" style="word-break:break-all"></p>
    <div class="qrow" style="justify-content:center">
      <button class="btn sub" id="btn-copy" type="button">접속 링크 복사하기</button>
      <button class="btn" id="btn-qr-close" type="button">닫기</button>
    </div>
  </div>
</div>

n": 3, "label": "정리", "title": "오늘 배운 것", "html": "<ul class=\"check\"><li>인식-판단-행동 순서로 로봇의 움직임을 계획할 수 있다.</li><li>AI가 고른 소리에 따라 로봇이 반응하게 만들 수 있다.</li></ul>", "say": "다음 시간에는 이 로봇으로 소음을 줄이는 방법을 실험해요.", "answer": "", "questions": [{"id": "q7", "type": "text", "text": "센서, AI, 로봇이 하는 일을 한 문장으로 써요.", "example": "마이크로 듣고 AI가 판단하면 로봇이 움직인다", "lines": 1}]}]}};
const GROUPS = ['1모둠', '2모둠', '3모둠', '4모둠', '5모둠', '6모둠'];
const POLL_MS = 3000, PING_MS = 20000;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const S = {role: 'student', lesson: 1, cls: 1, group: '', name: '', pin: '',
           view: 0, classStep: 0, answers: {}, sent: {}, dirty: {}, state: null, students: [], tab: 'lesson'};
const room = () => `L${S.lesson}-C${S.cls}`;
const L = () => LESSONS[S.lesson];
const qlist = () => L().steps.flatMap((st, i) => st.questions.map(q => ({...q, step: i})));

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 2600);
}
async function api(action, opts = {}) {
  const params = new URLSearchParams({room: room(), ...(opts.query || {})});
  if (S.role === 'teacher') params.set('pin', S.pin);
  const init = opts.body ? {method: 'POST', headers: {'content-type': 'application/json'},
    body: JSON.stringify({room: room(), pin: S.pin, ...opts.body})} : {};
  const res = await fetch(`/api/${action}?${params}`, init);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

/* ---------- 입장 ---------- */
function opts(el, items, cur, set) {
  el.innerHTML = items.map(([v, t]) => `<button type="button" class="opt${v == cur ? ' on' : ''}" data-v="${v}">${t}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('.opt'); if (!b) return; set(b.dataset.v);
    [...el.children].forEach(x => x.classList.toggle('on', x === b)); };
}
function setupGate() {
  const u = new URLSearchParams(location.search);
  if (u.get('lesson')) S.lesson = Math.min(4, Math.max(1, +u.get('lesson')));
  if (u.get('class')) S.cls = Math.min(7, Math.max(1, +u.get('class')));
  opts($('#opt-lesson'), [1, 2, 3, 4].map(n => [n, `${n}차시`]), S.lesson, v => S.lesson = +v);
  opts($('#opt-class'), [1, 2, 3, 4, 5, 6, 7].map(n => [n, `${n}반`]), S.cls, v => S.cls = +v);
  opts($('#opt-group'), GROUPS.map(g => [g, g]), '', v => S.group = v);
  $('#btn-role').onclick = () => {
    S.role = S.role === 'student' ? 'teacher' : 'student';
    $('#student-fields').hidden = S.role === 'teacher';
    $('#teacher-fields').hidden = S.role === 'student';
    $('#btn-role').textContent = S.role === 'teacher' ? '학생으로 입장하기' : '선생님으로 입장하기';
    $('#gate-msg').textContent = '';
  };
  $('#btn-enter').onclick = enter;
  $('#in-name').onkeydown = e => { if (e.key === 'Enter') enter(); };
  $('#in-pin').onkeydown = e => { if (e.key === 'Enter') enter(); };
}
async function enter() {
  const msg = $('#gate-msg');
  if (S.role === 'student') {
    S.name = $('#in-name').value.trim();
    if (!S.group) return msg.textContent = '모둠을 골라요.';
    if (!S.name) return msg.textContent = '이름을 써요.';
  } else {
    S.pin = $('#in-pin').value.trim();
    if (!S.pin) return msg.textContent = '교사 PIN을 써요.';
  }
  msg.textContent = '들어가는 중…';
  try {
    if (S.role === 'student') {
      const mine = await api('mine', {query: {group: S.group, name: S.name}});
      S.answers = mine.answers || {}; S.sent = JSON.parse(JSON.stringify(S.answers));
      await api('ping', {body: {group: S.group, name: S.name, step: 0}});
    } else {
      await api('teacher');
    }
  } catch (e) {
    if (location.protocol === 'file:' || String(e.message).includes('Failed to fetch') || String(e.message) === '404')
      msg.textContent = '서버에 연결하지 못했어요. Netlify에 배포한 주소에서 열어야 해요.';
    else msg.textContent = '들어가지 못했어요: ' + e.message;
    return;
  }
  history.replaceState(null, '', `?lesson=${S.lesson}&class=${S.cls}`);
  $('#gate').hidden = true; $('#room').hidden = false; $('#chips').hidden = false;
  $('#me').textContent = S.role === 'teacher' ? `[${S.cls}반] 선생님` : `[${S.cls}반 ${S.group}] ${S.name}`;
  $('#sub').textContent = `${S.lesson}차시 · ${L().title} · ${S.cls}반`;
  $('#btn-reset').hidden = S.role !== 'teacher';
  $('#tab-roster').hidden = S.role !== 'teacher';
  $('#btn-save').textContent = S.role === 'teacher' ? '결과저장(CSV)' : '내 답 저장';
  $('#goals').innerHTML = L().goals.map(g => `<li>${esc(g)}</li>`).join('');
  renderFlow(); renderStep(); poll(); setInterval(poll, POLL_MS);
  if (S.role === 'student') setInterval(() => api('ping', {body: {group: S.group, name: S.name, step: S.view}}).catch(() => {}), PING_MS);
}

/* ---------- 왼쪽 수업 흐름 ---------- */
function renderFlow() {
  let t = 0;
  $('#flow').innerHTML = L().steps.map((st, i) => {
    const from = t; t += st.min;
    const now = i === S.classStep, seen = i === S.view;
    return `<li><button type="button" data-i="${i}" class="${now ? 'now' : ''} ${seen && !now ? 'seen' : ''}">
      <span class="t"><span>${from}~${t}분 (${st.min}분) · ${esc(st.label)}</span>${now ? '<span class="tag">진행 중</span>' : ''}</span>
      <b>${i + 1}. ${esc(st.title)}</b></button></li>`;
  }).join('');
  $('#flow').onclick = e => { const b = e.target.closest('button'); if (!b) return; go(+b.dataset.i); };
}
async function go(i) {
  i = Math.max(0, Math.min(L().steps.length - 1, i));
  S.view = i;
  if (S.role === 'teacher') {
    S.classStep = i;
    try { await api('control', {body: {step: i}}); } catch (e) { toast('단계를 바꾸지 못했어요: ' + e.message); }
  }
  setTab('lesson'); renderFlow(); renderStep(); scrollTo({top: 0, behavior: 'smooth'});
}

/* ---------- 문항 ---------- */
function valueText(q, v) {
  if (q.type !== 'table' || !v || typeof v !== 'object') return String(v ?? '');
  const lines = [];
  q.rows.forEach((r, ri) => r.cells.forEach((c, ci) => {
    const x = v[`${ri}-${ci}`]; if (x) lines.push(`${r.label} / ${q.headers[ci + 1]}: ${x}`);
  }));
  return lines.join('\n');
}
const isEmpty = v => v === undefined || v === '' || (typeof v === 'object' && !Object.values(v).some(x => String(x).trim()));
function fieldHTML(q) {
  const v = S.answers[q.id];
  const dis = S.role === 'teacher' ? ' disabled' : '';
  if (q.type === 'text') {
    const rows = q.lines === 1 ? 1 : 3;
    return `<textarea class="field" rows="${rows}" data-q="${q.id}" placeholder="${q.example ? esc('예) ' + q.example) : ''}"${dis}>${esc(v || '')}</textarea>`;
  }
  const val = v && typeof v === 'object' ? v : {};
  let h = '<table><tr>' + q.headers.map(x => `<th>${esc(x)}</th>`).join('') + '</tr>';
  q.rows.forEach((r, ri) => {
    h += `<tr><td><b>${esc(r.label)}</b></td>`;
    r.cells.forEach((c, ci) => {
      const k = `${ri}-${ci}`, cur = val[k] || '', ex = q.examples[k] ? `예) ${q.examples[k]}` : '';
      if (c === 'ox') h += `<td><select class="field" data-q="${q.id}" data-k="${k}"${dis}><option value="">고르기</option>` +
        ['○ 맞음', '× 틀림'].map(o => `<option${o === cur ? ' selected' : ''}>${o}</option>`).join('') + '</select></td>';
      else h += `<td><input class="field" ${c === 'num' ? 'type="number" min="0"' : 'type="text"'} data-q="${q.id}" data-k="${k}" value="${esc(cur)}" placeholder="${esc(ex)}"${dis}></td>`;
    });
    h += '</tr>';
  });
  return h + '</table>';
}
function qNumber(id) { return qlist().findIndex(x => x.id === id) + 1; }
function questionHTML(q) {
  const n = qNumber(q.id);
  let h = `<div class="q" id="box-${q.id}"><p class="qt"><span class="num">${n}</span>${esc(q.text)}</p>${fieldHTML(q)}`;
  if (S.role === 'student') {
    h += `<div class="qrow"><button class="btn green" type="button" data-send="${q.id}">답 등록</button>
          <span class="st" id="st-${q.id}"></span></div>`;
    h += `<div class="answers" id="rev-${q.id}" hidden></div>`;
  } else {
    const on = S.state?.reveal?.[q.id];
    h += `<div class="qrow"><label class="switch"><input type="checkbox" data-reveal="${q.id}"${on ? ' checked' : ''}> 학생 화면에 반 전체 답 공개</label>
          <span class="st" id="cnt-${q.id}"></span></div><div class="answers" id="all-${q.id}"></div>`;
  }
  return h + '</div>';
}
function renderStep() {
  const st = L().steps[S.view], n = L().steps.length;
  let h = `<div class="stephead"><span class="pill">${S.view + 1}/${n} · ${esc(st.label)}</span>
    <button class="timer" type="button" data-min="${st.min}">${st.min}′</button>
    ${S.role === 'student' && S.view !== S.classStep ? '<span class="st warn">선생님은 다른 단계를 하고 있어요</span>' : ''}</div>
    <h2>${esc(st.title)}</h2>`;
  if (st.say) h += `<p class="say">${esc(st.say)}</p>`;
  h += st.html;
  h += st.questions.map(questionHTML).join('');
  if (st.answer && S.role === 'teacher') h += `<p class="answer">${esc(st.answer)}</p>`;
  h += `<div class="nav"><button class="btn sub" type="button" data-go="${S.view - 1}"${S.view === 0 ? ' disabled' : ''}>◀ 이전 단계</button>
        <button class="btn" type="button" data-go="${S.view + 1}"${S.view === n - 1 ? ' disabled' : ''}>다음 단계 ▶</button></div>`;
  const box = $('#view-lesson'); box.innerHTML = h;
  st.questions.forEach(q => { updateStatus(q.id); renderAnswers(q); });
  box.oninput = box.onchange = e => {
    const el = e.target.closest('[data-q]'); if (!el) return;
    const qid = el.dataset.q;
    if (el.dataset.k) { S.answers[qid] = {...(typeof S.answers[qid] === 'object' ? S.answers[qid] : {}), [el.dataset.k]: el.value}; }
    else S.answers[qid] = el.value;
    S.dirty[qid] = JSON.stringify(S.answers[qid]) !== JSON.stringify(S.sent[qid]);
    updateStatus(qid);
  };
  box.onclick = async e => {
    const send = e.target.closest('[data-send]'), nav = e.target.closest('[data-go]'), rv = e.target.closest('[data-reveal]');
    if (send) sendAnswer(send.dataset.send, send);
    if (nav && !nav.disabled) go(+nav.dataset.go);
    if (rv) {
      try { const r = await api('control', {body: {reveal: {[rv.dataset.reveal]: rv.checked}}}); S.state = r.state;
            toast(rv.checked ? '학생 화면에 답을 공개했어요.' : '공개를 껐어요.'); }
      catch (err) { rv.checked = !rv.checked; toast('바꾸지 못했어요: ' + err.message); }
    }
  };
  timer(box.querySelector('.timer'));
}
async function sendAnswer(qid, btn) {
  const v = S.answers[qid];
  if (isEmpty(v)) { $('#st-' + qid).textContent = '답을 먼저 써요.'; return; }
  btn.disabled = true; $('#st-' + qid).textContent = '보내는 중…';
  try {
    await api('answer', {body: {group: S.group, name: S.name, qid, value: v, step: S.view}});
    S.sent[qid] = JSON.parse(JSON.stringify(v)); S.dirty[qid] = false;
    S.sentAt = S.sentAt || {}; S.sentAt[qid] = new Date();
  } catch (e) { $('#st-' + qid).textContent = '보내지 못했어요. 다시 눌러요. (' + e.message + ')'; btn.disabled = false; return; }
  btn.disabled = false; updateStatus(qid);
}
function updateStatus(qid) {
  const el = $('#st-' + qid); if (!el) return;
  if (S.dirty[qid]) { el.className = 'st warn'; el.textContent = '고친 내용이 있어요. 답 등록을 눌러요.'; }
  else if (!isEmpty(S.sent[qid])) {
    const t = S.sentAt?.[qid]; el.className = 'st ok';
    el.textContent = '등록됨 ✓' + (t ? ' ' + t.toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit'}) : '') + ' · 다시 쓰면 고쳐져요';
  } else { el.className = 'st'; el.textContent = ''; }
}
function ansCards(list, q) {
  return '<div class="ansgrid">' + list.map(a => `<div class="ans"><div class="who">${esc(a.group)} · ${esc(a.name)}</div><pre>${esc(valueText(q, a.value))}</pre></div>`).join('') + '</div>';
}
function renderAnswers(q) {
  if (S.role === 'student') {
    const box = $('#rev-' + q.id); if (!box) return;
    const list = S.state?.reveal?.[q.id] ? (S.state.revealed?.[q.id] || []) : null;
    box.hidden = !list;
    if (list) box.innerHTML = `<h4>우리 반 친구들의 답 (${list.length}명)</h4>` + (list.length ? ansCards(list, q) : '<p class="st">아직 답이 없어요.</p>');
    return;
  }
  const box = $('#all-' + q.id); if (!box) return;
  const list = S.students.filter(s => !isEmpty(s.answers?.[q.id])).map(s => ({group: s.group, name: s.name, value: s.answers[q.id]}));
  $('#cnt-' + q.id).textContent = `${list.length}명 답함 / 입장 ${S.students.length}명`;
  box.innerHTML = list.length ? ansCards(list, q) : '<p class="st">아직 답이 없어요.</p>';
  const cb = document.querySelector(`[data-reveal="${q.id}"]`); if (cb) cb.checked = !!S.state?.reveal?.[q.id];
}

/* ---------- 진행 현황 (교사) ---------- */
function renderRoster() {
  const qs = qlist(), now = Date.now();
  const online = S.students.filter(s => now - (s.lastSeen || 0) < 45000).length;
  let h = `<h2>진행 현황</h2><p class="st">입장 ${S.students.length}명 · 지금 접속 ${online}명 · 칸의 ✓는 답을 등록한 문항입니다.</p>`;
  h += '<table class="roster"><tr><th>모둠 · 이름</th><th>보는 단계</th>' +
    qs.map(q => `<th title="${esc(q.text)}">${qNumber(q.id)}번<br><span class="st">${q.step + 1}단계</span></th>`).join('') + '<th>합계</th></tr>';
  S.students.forEach(s => {
    const n = qs.filter(q => !isEmpty(s.answers?.[q.id])).length;
    const on = now - (s.lastSeen || 0) < 45000;
    h += `<tr><td><span class="dot${on ? ' on' : ''}"></span>${esc(s.group)} · ${esc(s.name)}</td><td>${(s.step ?? 0) + 1}</td>` +
      qs.map(q => `<td>${isEmpty(s.answers?.[q.id]) ? '' : '<span class="done">✓</span>'}</td>`).join('') + `<td><b>${n}/${qs.length}</b></td></tr>`;
  });
  h += '</table>';
  if (!S.students.length) h += '<p class="st">아직 들어온 학생이 없어요. 위쪽 QR 입장으로 주소를 나눠 주세요.</p>';
  $('#view-roster').innerHTML = h;
}
function setTab(t) {
  S.tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#view-lesson').hidden = t !== 'lesson'; $('#view-roster').hidden = t !== 'roster';
  if (t === 'roster') renderRoster();
}
$('#tabs').onclick = e => { const b = e.target.closest('.tab'); if (b) setTab(b.dataset.tab); };

/* ---------- 실시간 동기화 ---------- */
let polling = false;
async function poll() {
  if (polling) return; polling = true;
  try {
    if (S.role === 'teacher') {
      const d = await api('teacher');
      S.state = d.state; S.students = d.students;
      if (d.pinIsDefault) $('#sync').textContent = '※ 교사 PIN이 기본값(0000)이에요. Netlify에서 TEACHER_PIN을 바꿔 주세요.';
      else $('#sync').textContent = '실시간 반영 중 · ' + new Date().toLocaleTimeString('ko-KR');
      $('#live').textContent = `실시간 접속 ${d.state.online || 0}명`;
      if (S.classStep !== d.state.step) { S.classStep = d.state.step; renderFlow(); }
      L().steps[S.view].questions.forEach(renderAnswers);
      if (S.tab === 'roster') renderRoster();
    } else {
      const d = await api('state');
      const prevStep = S.classStep, prevRev = JSON.stringify([S.state?.reveal, S.state?.revealed]);
      S.state = d;
      $('#live').textContent = `실시간 접속 ${d.online || 0}명`;
      $('#sync').textContent = '연결됨 · ' + new Date().toLocaleTimeString('ko-KR');
      if (d.step !== prevStep) {
        S.classStep = d.step;
        if (S.view === prevStep || S.view !== d.step) { S.view = d.step; renderStep(); toast(`선생님이 ${d.step + 1}단계로 넘겼어요.`); }
        renderFlow();
      }
      if (JSON.stringify([d.reveal, d.revealed]) !== prevRev) L().steps[S.view].questions.forEach(renderAnswers);
    }
  } catch (e) {
    $('#sync').textContent = '연결이 잠시 끊겼어요. 다시 시도하는 중…';
  } finally { polling = false; }
}

/* ---------- 타이머 ---------- */
function timer(chip) {
  if (!chip) return;
  let id = null, left = 0;
  const face = () => chip.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  chip.onclick = () => {
    if (id) { clearInterval(id); id = null; chip.removeAttribute('data-running'); chip.textContent = chip.dataset.min + '′'; return; }
    left = chip.dataset.min * 60; chip.setAttribute('data-running', ''); face();
    id = setInterval(() => { if (--left <= 0) { clearInterval(id); id = null; chip.removeAttribute('data-running'); chip.textContent = '끝!'; return; } face(); }, 1000);
  };
}

/* ---------- 결과저장 · 초기화 · QR · 나가기 ---------- */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const csvCell = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
$('#btn-save').onclick = async () => {
  const qs = qlist(), title = `${S.lesson}차시_${L().title.replace(/[?\s]/g, '')}_${S.cls}반`;
  if (S.role === 'teacher') {
    try { const d = await api('teacher'); S.students = d.students; } catch (e) { return toast('불러오지 못했어요: ' + e.message); }
    const head = ['반', '모둠', '이름', '마지막 등록', '등록 문항 수', ...qs.map(q => `${qNumber(q.id)}. ${q.text}`)];
    const rows = S.students.map(s => [`${S.cls}반`, s.group, s.name, s.at ? new Date(s.at).toLocaleString('ko-KR') : '',
      qs.filter(q => !isEmpty(s.answers?.[q.id])).length, ...qs.map(q => valueText(q, s.answers?.[q.id]))]);
    download(`${title}_결과.csv`, '﻿' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
    toast(`${S.students.length}명의 답을 CSV로 저장했어요.`);
  } else {
    const unsent = qs.filter(q => S.dirty[q.id]).length;
    const text = `${S.lesson}차시 ${L().title}\n${S.cls}반 ${S.group} ${S.name}\n저장한 때: ${new Date().toLocaleString('ko-KR')}\n\n` +
      qs.map(q => `${qNumber(q.id)}. ${q.text}\n${valueText(q, S.answers[q.id]) || '(빈칸)'}\n`).join('\n');
    download(`${title}_${S.group}_${S.name}.txt`, text, 'text/plain;charset=utf-8');
    toast(unsent ? `내 답을 파일로 저장했어요. 아직 등록 안 한 답이 ${unsent}개 있어요.` : '내 답을 파일로 저장했어요.');
  }
};
$('#btn-reset').onclick = async () => {
  const typed = prompt(`${S.lesson}차시 ${S.cls}반의 모든 답과 진행 상태를 지웁니다. 되돌릴 수 없어요.\n지우려면 "초기화"라고 쓰세요.`);
  if (typed !== '초기화') return;
  try { const r = await api('reset', {body: {}}); S.classStep = 0; S.view = 0; S.students = [];
        renderFlow(); renderStep(); toast(`초기화했어요. (${r.deleted}개 지움)`); }
  catch (e) { toast('초기화하지 못했어요: ' + e.message); }
};
$('#btn-qr').onclick = () => {
  const url = `${location.origin}${location.pathname}?lesson=${S.lesson}&class=${S.cls}`;
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  $('#qr-box').innerHTML = qr.createSvgTag({cellSize: 8, margin: 2, scalable: true});
  $('#qr-label').textContent = `${S.lesson}차시 · ${S.cls}반 — 찍고 모둠과 이름을 고르면 들어와요.`;
  $('#qr-url').textContent = url; $('#qr-modal').hidden = false;
  $('#btn-copy').onclick = () => navigator.clipboard.writeText(url).then(() => toast('링크를 복사했어요.'), () => toast('복사하지 못했어요. 주소를 직접 알려 주세요.'));
};
$('#btn-qr-close').onclick = () => $('#qr-modal').hidden = true;
$('#qr-modal').onclick = e => { if (e.target.id === 'qr-modal') $('#qr-modal').hidden = true; };
$('#btn-exit').onclick = () => {
  if (S.role === 'student' && Object.values(S.dirty).some(Boolean) && !confirm('등록하지 않은 답이 있어요. 그래도 나갈까요?')) return;
  location.href = `${location.pathname}?lesson=${S.lesson}&class=${S.cls}`;
};
addEventListener('beforeunload', e => { if (Object.values(S.dirty).some(Boolean)) { e.preventDefault(); e.returnValue = ''; } });
setupGate();
</script>
</body>
</html>
